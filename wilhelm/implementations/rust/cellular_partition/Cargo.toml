[package]
name = "cellular_partition"
version = "0.1.0"
edition = "2021"
authors = ["Wilhelm Framework"]
license = "MIT"
description = "Cellular partition framework: Observation = Computation = Process"
keywords = ["cellular", "partition", "poincare", "computing", "categorical"]
categories = ["science", "algorithms"]

[dependencies]
# For high-precision timing
instant = "0.1"

# For serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For random number generation (testing)
rand = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "speedup_demo"
path = "src/bin/speedup_demo.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[[bench]]
name = "completion_bench"
harness = false
