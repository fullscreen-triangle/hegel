[workspace]
resolver = "2"
members = [
    "src/core/oxygen-substrate",
    "src/core/electron-cascade", 
    "src/core/membrane-quantum",
    "src/core/genome-consultation",
    "src/evidence/fuzzy-bayesian",
    "src/evidence/evidence-rectification",
    "src/evidence/temporal-decay",
    "src/intelligence/mzekezeke",
    "src/intelligence/diggiden", 
    "src/intelligence/hatata",
    "src/intelligence/spectacular",
    "src/intelligence/nicotine",
    "src/federated/privacy-preserving",
    "src/federated/consensus-protocol",
    "src/federated/bloodhound-sync",
    "src/api/rest-interface",
    "src/wasm/frontend-bindings",
    "src/utils/s-distance",
    "src/utils/zero-computation",
    "src/utils/oscillatory-dynamics"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hegel Team <hegel@biological-computing.org>"]
license = "MIT OR Apache-2.0"
description = "Revolutionary Oxygen-Enhanced Bayesian Molecular Evidence Networks for Biological Computing"
homepage = "https://github.com/hegel-project/hegel"
repository = "https://github.com/hegel-project/hegel"
readme = "README.md"
keywords = ["biological-computing", "molecular-evidence", "bayesian-networks", "quantum-biology", "oxygen-enhancement"]
categories = ["science", "biology", "algorithms", "web-programming"]

[workspace.dependencies]
# Async runtime and utilities
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization and data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Mathematical and scientific computing
nalgebra = "0.32"
ndarray = "0.15"
statrs = "0.16"
rand = "0.8"
rand_distr = "0.4"

# Biological data structures
bio = "1.6"
bio-types = "1.0"

# Quantum computing simulation
qip = "0.12"
quantum = "0.1"

# Cryptography and privacy
ring = "0.17"
aes-gcm = "0.10"
sha3 = "0.10"

# Networking and HTTP
reqwest = { version = "0.11", features = ["json"] }
hyper = { version = "0.14", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["full"] }

# Database and storage
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
redis = { version = "0.24", features = ["tokio-comp"] }

# Logging and monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.13"
clap = { version = "4.4", features = ["derive"] }

# WebAssembly support
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"

# Parallel processing
rayon = "1.8"
crossbeam = "0.8"

# Time and scheduling
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Memory management and optimization
parking_lot = "0.12"
arc-swap = "1.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
debug = false
strip = true

[profile.dev]
debug = true
opt-level = 0
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true

# Biological computing optimizations
[profile.biological-release]
inherits = "release"
opt-level = "s"        # Optimize for size in biological systems
lto = "thin"           # Faster compilation for iterative biological research
codegen-units = 4      # Balance compilation time vs optimization

# WebAssembly profile for frontend integration
[profile.wasm]
inherits = "release"
opt-level = "z"        # Optimize for size for web deployment
panic = "abort"
lto = true
