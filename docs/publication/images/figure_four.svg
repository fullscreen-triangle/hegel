<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">

    <title>Figure 2B Quantum Tunneling Probability Surface</title>
    <desc>Distance vs energy barrier vs tunneling probability rendered as pseudo-3D color bands with
        P=0.95 threshold and biological enhancement region.</desc>
    <rect width="1600" height="1000" fill="#FFFFFF" />
    <rect x="50" y="50" width="1500" height="900" fill="#FFFFFF" stroke="#222" /> <!-- Panel label -->
    <rect x="80" y="80" width="60" height="60" fill="#FFFFFF" stroke="#222" />
    <text x="110" y="120" font-family="Inter" font-size="40" text-anchor="middle" fill="#222"
        font-weight="600">B</text> <!-- Axes (Isometric style approximation) -->
    <g font-family="Inter" font-size="26" fill="#222">
        <text x="400" y="950">Distance (nm)</text>
        <text x="1550" y="820" transform="rotate(-90,1550,820)">Energy Barrier (eV)</text>
        <text x="1180" y="140">Tunneling Probability (0–1)</text>
    </g> <!-- Colored contour bands
    (distance horizontal, barrier vertical) -->
    <g transform="translate(250,200)"> <!-- Generate layered rectangles to emulate gradient bands --> <!-- Each band lower barrier & shorter distance = higher
        probability -->
        <g stroke="#DDD" stroke-width="1">
            <rect x="0" y="0" width="1000" height="600" fill="#003366" />
            <rect x="60" y="40" width="880" height="520" fill="#1B4F88" />
            <rect x="120" y="80" width="760" height="440" fill="#3D76A8" />
            <rect x="180" y="120" width="640" height="360" fill="#6CA3C8" />
            <rect x="240" y="160" width="520" height="280" fill="#99C3DA" />
            <rect x="300" y="200" width="400" height="200" fill="#C3DFEA" />
            <rect x="360" y="240" width="280" height="120" fill="#E8F2F6" />
            <rect x="400" y="270" width="200" height="80" fill="#FFF0D0" />
            <rect x="430" y="290" width="140" height="40" fill="#FFD190" />
            <rect x="450" y="300" width="100" height="20" fill="#FFA850" />
            <rect x="470" y="305" width="60" height="10" fill="#FF7A30" />
            <rect x="480" y="308" width="40" height="4" fill="#FF4C1A" />
            <rect x="488" y="310" width="24" height="2" fill="#FF0000" />
        </g> <!-- P=0.95
        threshold line (approx elliptical) -->
        <path d="M400 270 C300 250 240 210 180 120" stroke="#222" stroke-width="4"
            stroke-dasharray="12,10" fill="none" />
        <text x="300" y="250" font-family="Inter" font-size="26" fill="#222">P=0.95 threshold</text> <!--
        Biological enhancement region highlight -->
        <rect x="240" y="160" width="520" height="280" fill="#E8F5E8"
            stroke="#1B8E3E"
            stroke-width="3" />
        <text x="260" y="190" font-family="Inter" font-size="26" fill="#1B8E3E">Biological
            enhancement zone</text> <!-- Axes tick labels (distance) -->
        <g font-family="Inter" font-size="24" fill="#222">
            <text x="0" y="640">1</text>
            <text x="250" y="640">3</text>
            <text x="500" y="640">5</text>
            <text x="750" y="640">7</text>
            <text x="1000" y="640">10</text>
        </g> <!-- Barrier ticks (eV) -->
        <g font-family="Inter" font-size="24" fill="#222" text-anchor="end">
            <text x="-10" y="600">0.1</text>
            <text x="-10" y="480">0.5</text>
            <text x="-10" y="360">1.0</text>
            <text x="-10" y="240">1.5</text>
            <text x="-10" y="120">2.0</text>
        </g>
    </g> <!-- Legend gradient strip -->
    <g transform="translate(1320,300)">
        <text x="0" y="-20" font-family="Inter" font-size="26" fill="#222">Probability</text>
        <rect x="0" y="0" width="60" height="400" fill="url(#probgrad)" stroke="#222" />
        <defs>
            <linearGradient id="probgrad" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#FF0000" />
                <stop offset="20%" stop-color="#FF7A30" />
                <stop offset="40%" stop-color="#FFD190" />
                <stop offset="60%" stop-color="#6CA3C8" />
                <stop offset="80%" stop-color="#1B4F88" />
                <stop offset="100%" stop-color="#003366" />
            </linearGradient>
        </defs>
        <text x="70" y="20" font-family="Inter" font-size="22" fill="#222">1.0</text>
        <text x="70" y="210" font-family="Inter" font-size="22" fill="#222">0.5</text>
        <text x="70" y="395" font-family="Inter" font-size="22" fill="#222">0.0</text>
    </g>
</svg>