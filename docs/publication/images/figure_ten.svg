            <circle cx="205.4154550" cy="54.3" r="6" fill="#F27F1B" opacity="0.75" />
            <circle cx=" (0.8518554825-0.5)/0.5*300 " cy=" (1-0.9925402256)/0.03*600 " r="6"
                fill="#F27F1B" opacity="0.75" />
            <circle cx="211.1132895" cy="152.8" r="6" fill="#F27F1B" opacity="0.75" />
            <!-- Caffeine sampled -->
            <circle cx=" (0.6810712530-0.5)/0.5*300 " cy=" (1-0.999)/0.03*600 " r="6" fill="#2AA876"
                opacity="0.75" />
            <circle cx="108.6427500" cy="20.0" r="6" fill="#2AA876" opacity="0.75" />
            <circle cx=" (0.8347068257-0.5)/0.5*300 " cy=" (1-0.9882442049)/0.03*600 " r="6"
                fill="#2AA876" opacity="0.75" />
            <circle cx="200.8240954" cy="244.0" r="6" fill="#2AA876" opacity="0.75" />
            <!-- Insulin sampled -->
            <circle cx=" (0.5177315622-0.5)/0.5*300 " cy=" (1-0.9901267730)/0.03*600 " r="6"
