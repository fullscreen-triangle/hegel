            <circle cx="242.3611625" cy="305.3" r="6" fill="#D82626" opacity="0.75" />
            <circle cx=" (0.9928873807? ignore) " r="0" />
            <!-- ATP sampled -->
            <circle cx=" (0.7630599859-0.5)/0.5*300 " cy=" (1-0.9908938856)/0.03*600 " r="6"
                fill="#2C75FF" opacity="0.75" />
            <circle cx="157.8359916" cy="172.2" r="6" fill="#2C75FF" opacity="0.75" />
            <circle cx=" (0.7990657573-0.5)/0.5*300 " cy=" (1-0.999)/0.03*600 " r="6" fill="#2C75FF"
                opacity="0.75" />
            <circle cx="179.4394544" cy="20.0" r="6" fill="#2C75FF" opacity="0.75" />
            <circle cx=" (0.8159871301-0.5)/0.5*300 " cy=" (1-0.9882741620)/0.03*600 " r="6"
                fill="#2C75FF" opacity="0.75" />
            <circle cx="189.5922781" cy="243.3" r="6" fill="#2C75FF" opacity="0.75" />
            <!-- Dopamine sampled -->
