            <text x="20" y="90">Qualitative: higher confidence clusters near top</text>
            <text x="20" y="120">Request full scatter if needed</text>
        </g>
    </g> <!--
    Figure caption -->
    <g transform="translate(90,1010)" font-family="Inter" font-size="22">
        <text x="0" y="0"> Updated experimental accuracy results: (A) Distribution with mean 0.99068
            (blue dashed), ±1 SD band (light blue), min 0.97104 and max 0.999. (B) Mean accuracies
            per molecule (20 trials each) show ATP and dopamine highest (~0.9922), insulin lowest
            (~0.9882). (C) Subsampled confidence vs accuracy scatter indicates moderate positive
            association; success_rate=0.57. </text>
    </g>
</svg>